<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 96" role="img"
     aria-labelledby="title desc" width="240" height="96">
  <!--
    Palette reason: the name is a compound, backup + attest. The colour split
    falls exactly at that morpheme boundary. Slate (#31465c) reads as the stored
    data, teal (#0f766e) reads as the verification act. No accent is used in the
    logo because a wordmark should carry one idea, the split itself.
    Two core colours, neutrals for the background and rule.
  -->
  <title id="title">backupattest wordmark</title>
  <desc id="desc">The word backupattest, with backup in slate and attest in teal,
    the colour changing at the morpheme boundary between the two words.</desc>
  <rect x="0" y="0" width="240" height="96" fill="#ffffff"/>
  <line x1="16" y1="70" x2="224" y2="70" stroke="#c9d2dc" stroke-width="1.5"/>
